[warn-command]
syntax = warn (<warn-if>)? (<warn-level>)? (<string> | message=<string> | field=<field>)
shortdesc = Shows a custom message under the search bar, optionally on a condition.
description = Passes results through unchanged and shows one message in the search messages. \
  The text is free text (quote it if it contains '='), message="...", or the value of a field \
  given with field=. Without if=, the message is always shown, even with no results. \
  With if=, it is shown only if at least one result satisfies the condition; field= then reads \
  the first matching result. See the if= and level= options for details.
usage = public
example1 = | warn "This dataset is incomplete before 2026-10-01"
comment1 = Always show a warning.
example2 = | stats count | warn if="count = 0" level=error "No data: do not use this report"
comment2 = Stop the search when the condition holds: no result passes.
example3 = | eval msg="Only " . count . " hosts" | warn if="count < 10" field=msg
comment3 = Show the value of a field built with eval.
example4 = | warn if="status=500 AND like(uri, \"/api/%\")" "API errors in the results"
comment4 = Condition combining a comparison and a function; inner quotes are escaped.
example5 = | eval old=if(_time < relative_time(now(), "-1d"), 1, 0) | warn if="old=1" "Data older than one day"
comment5 = For anything outside the supported subset, compute it with eval first.
related = where eval
tags = warn warning message banner notice
category = streaming

[warn-if]
syntax = if=<string>
description = Condition in a subset of the where syntax, evaluated on each result. \
  Quote it if it contains spaces or quotes: if="count > 1000", if="host=\"web01\"". \
  Operators: = == != < > <= >= AND OR NOT XOR LIKE IN(...) + - * / % . and parentheses. \
  Operands: field names, 'field names with spaces', "strings", numbers. \
  Functions: if case coalesce in like match cidrmatch isnull isnotnull isnum isint isstr \
  null true false len lower upper trim ltrim rtrim substr replace tostring tonumber abs round \
  floor ceiling ceil sqrt pow min max mvcount now. \
  Any other function is refused with an error: compute it with eval before warn. \
  Like where, = is case-sensitive, and a comparison with a missing field is false.

[warn-level]
syntax = level=(warn|error|info)
description = warn (default): yellow banner. error: stops the search, no result passes \
  (Splunk 10: failed search; Splunk 9: no results and a red banner). \
  info: shown only in the Job menu and the Job Inspector. \
  In dashboards the warn message sits behind an icon in the panel header.
